version: '3.8'

services:
  # Database - PostgreSQL with SSL
  postgres:
    image: postgres:16.3-alpine
    container_name: peykan_postgres
    environment:
      POSTGRES_DB: peykan
      POSTGRES_USER: peykan_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - plusistanbul_postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    # Port exposure removed for security - PostgreSQL only accessible within peykan_internal network
    # For local debugging, use: docker exec -it peykan_postgres psql -U peykan_user -d peykan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peykan_user -d peykan"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - peykan_internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis - امن و بدون دسترسی بیرونی
  redis:
    image: redis:7.4-alpine
    container_name: peykan_redis
    volumes:
      - peykan_redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - peykan_redis_logs:/var/log/redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-dev_redis_123}"]
    # Port exposure removed for security - Redis only accessible within peykan_internal network
    # For local debugging, use: docker exec -it peykan_redis redis-cli -a <password>
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - peykan_internal
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peykan_backend
    env_file:
      - ./backend/env.production.dev
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://peykan_user:${POSTGRES_PASSWORD:-dev_password_123}@postgres:5432/peykan
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_123}@peykan_redis:6379/1
      - DJANGO_SETTINGS_MODULE=peykan.settings_production
      - ALLOWED_HOSTS=peykantravelistanbul.com,www.peykantravelistanbul.com,localhost,backend
      - CORS_ALLOWED_ORIGINS=https://peykantravelistanbul.com,https://www.peykantravelistanbul.com
      - CSRF_TRUSTED_ORIGINS=https://peykantravelistanbul.com,https://www.peykantravelistanbul.com
    volumes:
      - peykan_static:/app/staticfiles
      - peykan_media:/app/media
      - ./backend/logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"  # Expose only to localhost for nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - peykan_internal
      - peykan_external
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: peykan_frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://peykantravelistanbul.com/api/v1
      - NEXT_PUBLIC_SITE_URL=https://peykantravelistanbul.com
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3000:3000"  # Expose only to localhost for nginx
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - peykan_internal
      - peykan_external
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
  
  # Celery Worker for background tasks
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peykan_celery
    command: celery -A peykan worker --loglevel=info
    env_file:
      - ./backend/env.production.dev
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://peykan_user:${POSTGRES_PASSWORD:-dev_password_123}@postgres:5432/peykan
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_123}@peykan_redis:6379/1
      - DJANGO_SETTINGS_MODULE=peykan.settings_production
    volumes:
      - peykan_media:/app/media
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A peykan inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - peykan_internal
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Local Nginx for development (optional - main nginx is in Plus project)
  # This nginx is only for local development without the main nginx
  nginx-local:
    build:
      context: ./nginx
      dockerfile: Dockerfile.dev
    container_name: peykan_nginx_local
    ports:
      - "8080:80"  # Changed to 8080 to avoid conflict with main nginx
    volumes:
      - peykan_nginx_logs:/var/log/nginx
      - peykan_static:/var/www/peykan/static:ro
      - peykan_media:/var/www/peykan/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - peykan_external
    profiles:
      - local-only  # Only start with --profile local-only

volumes:
  # Peykan project volumes with consistent naming
  # Using existing postgres_data volume to preserve data
  plusistanbul_postgres_data:
    external: true
  peykan_redis_data:
    driver: local
  peykan_redis_logs:
    driver: local
  peykan_static:
    driver: local
    name: plusistanbul_static_volume_dev  # Named volume for external access
  peykan_media:
    driver: local
    name: plusistanbul_media_volume_dev  # Named volume for external access
  peykan_nginx_logs:
    driver: local

networks:
  # Internal network for Peykan services
  peykan_internal:
    driver: bridge
    internal: false  # Allow internet access for development (set to true in production)
  
  # External network for nginx and inter-project communication
  peykan_external:
    driver: bridge
    name: plusistanbul_peykan_external  # Named network for external access
